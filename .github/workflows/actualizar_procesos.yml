name: Actualizador Automatico de Licitaciones OECE

on:
  schedule:
    # Se ejecuta todos los días a las 6:00 AM (hora Perú)000000
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas openpyxl

    - name: Ejecutar Extractor de Contrataciones OECE
      run: |
        python "GENERA JSON CON DUPLICIDAD.py"

    - name: Guardar y publicar cambios en GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git status
        if git diff-index --quiet HEAD; then
          echo "No hay cambios nuevos en las licitaciones."
        else
          git commit -m "Automatización: Licitaciones OECE actualizadas"
          git push
        fi
